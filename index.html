<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi"/>
    <title>Visitor Book</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/styles.min.css" />
    <link rel="stylesheet" href="assets/font-awesome/css/font-awesome.min.css"/>
    <link href="https://fonts.googleapis.com/css?family=Poppins&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="assets/alertifyjs/css/alertify.min.css" />
    <script src="assets/jquery.min.js"></script>
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="assets/alertifyjs/alertify.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('assets/images/background-in.png') no-repeat center center fixed;
            background-size: cover; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            opacity: 0;
            animation: fadeIn 2s forwards; /* Animasi fade in */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .button-container {
            text-align: center;
        }

        /* Transisi dan Animasi pada Tombol */
        .btn-custom {
            padding: 25px 40px;
            width: 250px;
            margin: 10px;
            font-size: 28px;
            border: none;
            border-radius: 15px;
            color: white;
            background: linear-gradient(to right, #43cea2, #185a9d);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease-in-out, transform 0.2s ease, box-shadow 0.3s ease;
            animation: slideUp 1s ease-out; /* Animasi naik dari bawah */
        }

        .btn-custom:hover {
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* Header untuk logo dan waktu */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: transparent;
            color: white;
            font-size: 18px;
            z-index: 1000;
        }

        .header .company {
            display: flex;
            align-items: center;
        }

        .header .company img {
            height: 40px;
            margin-right: 10px;
        }

        .header .datetime {
            text-align: right;
            font-weight: bold;
            line-height: 1.5;
        }

        /* Fullscreen video styling */
        #fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 9999;
            background-color: black;
        }

        #fullscreen-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            /* background-color: rgb(126, 199, 255);  */
            color: white;
            text-align: center;
            padding: 10px 0;
            /* box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2); */
            z-index: 1000; 
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-logo img {
            width: 30px;
            height: auto;
            margin-bottom: 5px; 
        }

        .footer-text p {
            margin: 0;
            font-size: 14px;
        }

    </style>
</head>

<body>
    <!-- Header dengan Logo dan Waktu -->
    <div class="header">
        <div class="company">
            <img src="assets/images/logogratia2.png" alt="Logo" style="width: 100px; height: 60px;">
            <span style="color: #ffffff; font-weight: bold;">PT. Gratia Jaya Mulya</span>
        </div>
        <div class="datetime" id="datetime"></div>
    </div>

    <div class="button-container" id="main-content">
        <button class="btn-custom" id="visitorBookBtn">VISITOR BOOK</button>
        <button class="btn-custom" id="visitorBookMeeting">BOOKING ROOM</button>
    </div>

    <!-- Video for fullscreen -->
    <div id="fullscreen-video">
        <video id="video" autoplay loop muted>
            <source src="assets/video/video-opening.mp4" type="video/mp4">
        </video>        
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text" style="font-weight: bold;">
                <p>Powered By</p>
            </div>
            <div class="footer-logo">
                <img src="assets/images/logogratia2.png" alt="Footer Logo" />
            </div>
            <div class="footer-text">
                <p>&nbsp;&nbsp;&nbsp;PT. Gratia Jaya Mulya&nbsp;&nbsp;&nbsp;</p>
            </div>
        </div>
    </footer>

    <script>
        // Fungsi untuk menampilkan tanggal dan waktu saat ini
        function updateDateTime() {
            const now = new Date();
            
            // Opsi format untuk tanggal
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const formattedDate = now.toLocaleDateString('id-ID', options); 
            
            // Format waktu ke jam:menit dalam format 24 jam
            const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            
            document.getElementById('datetime').innerHTML = `${formattedDate}<br>${formattedTime}`;
        }
        setInterval(updateDateTime, 1000);

        let inactivityTime = 5000; 
        let timeout;
        const videoElement = document.getElementById('fullscreen-video');
        const mainContent = document.getElementById('main-content');
        const video = document.getElementById('video');
        const visitorBookBtn = document.getElementById('visitorBookBtn');
        const visitorBookMeeting = document.getElementById('visitorBookMeeting');

        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(showVideo, inactivityTime);
        }

        function showVideo() {
            mainContent.style.display = 'none';
            videoElement.style.display = 'block';
            video.play();
        }

        function hideVideo() {
            video.pause();
            videoElement.style.display = 'none';
            mainContent.style.display = 'flex'; 
        }

        // Event listener for user interactions
        document.addEventListener('click', resetTimer);
        document.addEventListener('touchstart', resetTimer);
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('keydown', resetTimer);

        // keluar fullscreen
        videoElement.addEventListener('click', hideVideo);
        videoElement.addEventListener('touchstart', hideVideo);

        // Redirect to index2.html 
        visitorBookBtn.addEventListener('click', function() {
            window.location.href = 'index2.html';
        });

         // Redirect to index3.html 
         visitorBookMeeting.addEventListener('click', function() {
            window.location.href = 'index3.html';
        });

        // Initialize the timer
        resetTimer();
    </script>
</body>
</html>
